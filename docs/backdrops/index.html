<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auth-kit backdrops</title>
<meta name="description" content="Every backdrop style in every family, behind the same sign-in card.">
<!--
  The backdrop demo: every style × every family behind the same sign-in card. It loads the built
  package, so serve the repo first:  npm run demo:backdrops  (builds, then serves 127.0.0.1:4173).
  One scene at full size: ?scene=1&style=aurora&family=unc&seed=k3f9x2ab  (add &phone=1, &hud=1).
-->
<style>
  :root {
    --ink: #16181d;
    --muted: #5b6270;
    --line: #dfe3e8;
    --bg: #f7f8fa;
    --surface: #ffffff;
    --accent: #1f5fbf;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header.top { padding: 28px 24px 8px; max-width: 1320px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 0 4px; }
  .controls label { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); }
  .controls input[type=text] { font: inherit; width: 12ch; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .controls button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .controls button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  main.grid { max-width: 1320px; margin: 0 auto; padding: 8px 24px 64px; }
  .row { display: grid; grid-template-columns: 200px repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; padding: 16px 0; border-top: 1px solid var(--line); }
  .row.head { border-top: 0; padding-bottom: 0; position: sticky; top: 0; background: var(--bg); z-index: 5; padding-top: 10px; }
  .row.head div { font-weight: 650; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .style-name { font-weight: 650; font-size: 16px; }
  .style-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .style-meta code { font-size: 12px; }
  .tile { position: relative; display: block; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 0 0 1px rgba(16, 24, 40, 0.06); background: #eee; }
  .tile .stat { position: absolute; right: 8px; bottom: 8px; font: 11px/1.2 ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, 0.85); padding: 3px 6px; border-radius: 6px; color: #333; display: none; }
  body.show-stats .tile .stat { display: block; }
  .tile a.open { position: absolute; inset: 0; z-index: 3; }
  .tile a.open:focus-visible { outline: 3px solid #3892e1; outline-offset: -3px; border-radius: 10px; }

  /* A scene: the backdrop and the real-size card, at a virtual viewport size, scaled to fit. */
  .scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .scene .card-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; }

  /* The sign-in card (design report §7.1), a static copy for the demo. */
  .card { position: relative; width: 440px; max-width: 100%; background: #fff; border-radius: 6px; padding: 36px 36px 28px; box-shadow: 0 1px 2px rgba(9, 41, 64, 0.06), 0 12px 32px -12px rgba(9, 41, 64, 0.18); border-top: 4px solid var(--rule); color: #3c434b; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card .owner { margin: 0 0 6px; font-size: 14px; color: #5b6270; }
  .card h2 { margin: 0 0 24px; font-size: 28px; line-height: 1.2; color: #092940; font-weight: 650; }
  .card label { display: block; font-weight: 600; color: #092940; margin-bottom: 6px; }
  .card .input { height: 48px; border: 1px solid #8a94a3; border-radius: 4px; padding: 0 12px; display: flex; align-items: center; color: #6b7280; margin-bottom: 20px; }
  .card .button { height: 48px; border-radius: 4px; background: var(--button); color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  .card .links { display: flex; flex-wrap: wrap; gap: 6px 20px; }
  .card .links span { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
  .card .foot { margin: 24px 0 0; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 14px; color: #5b6270; }

  /* One scene, full size. */
  body.single { overflow: hidden; }
  body.single .scene { position: fixed; inset: 0; transform: none; }
  .hud { position: fixed; left: 12px; bottom: 12px; z-index: 10; font: 12px/1.3 ui-monospace, Menlo, monospace; background: rgba(255, 255, 255, 0.9); padding: 6px 8px; border-radius: 6px; }
  @media (max-width: 900px) {
    .row { grid-template-columns: 1fr; }
    .row.head { display: none; }
  }
</style>
</head>
<body>
<script type="module">
  import { BACKDROP_FAMILIES, BACKDROP_FAMILY_IDS, backdropStyle, offeredStyles, latestStyleVersion, renderBackdrop, randomSalt } from '../../dist/backdrops/index.js';

  const params = new URLSearchParams(location.search);
  const OWNER = { osbm: 'NC Office of State Budget and Management', unc: 'UNC-Chapel Hill', personal: 'Yokum Lab' };
  const FOOT = { osbm: 'A tool of the NC Office of State Budget and Management.', unc: 'A UNC-Chapel Hill project.', personal: 'Made by Yokum Lab.' };
  const HINT = { osbm: 'name@osbm.nc.gov', unc: 'name@unc.edu', personal: 'name@example.com' };

  function cardHtml(family, siteName) {
    const c = BACKDROP_FAMILIES[family].card;
    return `<div class="card" data-backdrop-card style="--rule:${c.rule};--button:${c.button};--link:${c.link}">
      <p class="owner">${OWNER[family]}</p>
      <h2>Sign in to ${siteName}</h2>
      <label>Email address</label>
      <div class="input">${HINT[family]}</div>
      <div class="button">Sign in with a passkey</div>
      <div class="links"><span>Use a password instead</span><span>Email me a code instead</span></div>
      <p class="foot">${FOOT[family]}</p>
    </div>`;
  }

  /** A scene at a virtual size, scaled to `displayWidth` (or full-window). Returns its controller. */
  function scene(host, { style, family, seed, width, height, displayWidth, reducedMotion }) {
    const el = document.createElement('div');
    el.className = 'scene';
    el.style.width = `${width}px`;
    el.style.height = `${height}px`;
    const scale = displayWidth ? displayWidth / width : 1;
    if (displayWidth) el.style.transform = `scale(${scale})`;
    el.innerHTML = `<canvas aria-hidden="true"></canvas><div class="card-wrap">${cardHtml(family, 'Example Site')}</div>`;
    host.appendChild(el);
    const canvas = el.querySelector('canvas');
    return renderBackdrop(canvas, {
      style, family, seed,
      card: el.querySelector('[data-backdrop-card]'),
      reducedMotion: reducedMotion ? true : 'auto',
      ...(displayWidth ? { pixelRatio: Math.min(2, (window.devicePixelRatio || 1)) * scale, maxFps: 20 } : {}),
    });
  }

  if (params.get('scene') === '1') {
    document.body.classList.add('single');
    const phone = params.get('phone') === '1';
    const style = params.get('style') ?? 'aurora';
    const family = params.get('family') ?? 'osbm';
    const seed = params.get('seed') ?? 'demo';
    document.title = `${backdropStyle(style)?.label ?? style} · ${BACKDROP_FAMILIES[family]?.label ?? family}`;
    const controller = scene(document.body, { style, family, seed, width: innerWidth, height: innerHeight, reducedMotion: params.get('still') === '1' });
    window.__backdrop = controller;
    if (params.get('hud') === '1') {
      const hud = document.createElement('div');
      hud.className = 'hud';
      document.body.appendChild(hud);
      setInterval(() => {
        const s = controller.stats();
        hud.textContent = `${s.style} v${s.styleVersion} · ${s.width}×${s.height} @${s.pixelRatio.toFixed(2)}x · ${s.fps} fps · avg ${s.averageFrameMs.toFixed(2)} ms · max ${s.maxFrameMs.toFixed(1)} ms`;
      }, 500);
    }
    void phone;
  } else {
    document.body.innerHTML = `
      <header class="top">
        <h1>Backdrops</h1>
        <p class="lede">Every generative style in every family, behind the same sign-in card. The art is seeded: the same seed draws the same picture for a style version, always. Click a tile to open it full size.</p>
        <div class="controls">
          <label>Seed <input type="text" id="seed" spellcheck="false"></label>
          <button type="button" class="primary" id="shuffle">Shuffle</button>
          <label><input type="checkbox" id="motion" checked> Motion</label>
          <label><input type="checkbox" id="stats"> Frame cost</label>
        </div>
      </header>
      <main class="grid" id="grid"></main>`;
    const grid = document.getElementById('grid');
    const seedInput = document.getElementById('seed');
    seedInput.value = params.get('seed') ?? 'demo';
    let controllers = [];

    function build() {
      for (const c of controllers) c.destroy();
      controllers = [];
      grid.innerHTML = `<div class="row head"><div>Style</div>${BACKDROP_FAMILY_IDS.map((f) => `<div>${BACKDROP_FAMILIES[f].label}</div>`).join('')}</div>`;
      const motion = document.getElementById('motion').checked;
      for (const id of offeredStyles()) {
        const module = backdropStyle(id);
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<div><div class="style-name">${module.label}</div><div class="style-meta">${module.description}<br><code>${id}</code> · v${latestStyleVersion(id)} · ${module.interactivity === 'none' ? 'no pointer' : module.interactivity === 'tap' ? 'tap' : 'pointer'}</div></div>`;
        for (const family of BACKDROP_FAMILY_IDS) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          row.appendChild(tile);
          const href = `?scene=1&style=${id}&family=${family}&seed=${encodeURIComponent(seedInput.value)}&hud=1`;
          tile.innerHTML = `<a class="open" href="${href}" target="_blank" aria-label="${module.label}, ${BACKDROP_FAMILIES[family].label}, full size"></a><span class="stat"></span>`;
          requestAnimationFrame(() => {
            const controller = scene(tile, { style: id, family, seed: seedInput.value, width: 1200, height: 750, displayWidth: tile.clientWidth, reducedMotion: !motion });
            controllers.push(controller);
            const stat = tile.querySelector('.stat');
            setInterval(() => {
              const s = controller.stats();
              stat.textContent = `${s.fps} fps · ${s.averageFrameMs.toFixed(2)} ms`;
            }, 1000);
          });
        }
        grid.appendChild(row);
      }
    }
    document.getElementById('shuffle').addEventListener('click', () => { seedInput.value = randomSalt(); build(); });
    seedInput.addEventListener('change', build);
    document.getElementById('motion').addEventListener('change', build);
    document.getElementById('stats').addEventListener('change', (e) => document.body.classList.toggle('show-stats', e.target.checked));
    build();
  }
</script>
</body>
</html>
