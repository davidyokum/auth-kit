- heading "Choose how you’ll sign in next time" [level=1]
- paragraph: A passkey is quickest. You can add another way later under My account.
- region "Passkey (recommended)":
  - heading "Passkey (recommended)" [level=2]
  - paragraph: Use your face, fingerprint, or device PIN. Nothing to remember or type.
  - button "Create a passkey"
- region "Password and authenticator app":
  - heading "Password and authenticator app" [level=2]
  - paragraph: A password plus a 6-digit code from an app like Microsoft Authenticator or your password manager.
  - button "Use a password instead"
- paragraph: Don’t create a passkey on a shared computer.
