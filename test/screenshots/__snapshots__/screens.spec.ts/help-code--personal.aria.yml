- heading "Didn’t get a code?" [level=1]
- list:
  - listitem: Wait a minute.
  - listitem: Check your junk or quarantine folder for an email from Example Reports.
  - listitem: /Send a new code and use the newest one\. It works for \d+ minutes\./
- paragraph: Accounts with an authenticator app can’t get emailed codes. Use your password and authenticator code, or your passkey.
